[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-forensics-lab"
version = "0.4.2"
description = "Desktop laboratory for forensic inspection of PDF and PPTX metadata"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "pypdf>=6.10,<7",
    "pyHanko>=0.35,<0.36",
    "python-docx>=1.2,<2",
    "Pillow>=12,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pyinstaller>=6.11,<7",
]

[project.scripts]
document-forensics-lab = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
